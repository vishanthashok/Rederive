[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rederive"
version = "0.1.0"
description = "Retractable, rebuildable agent memory with lineage."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "redis>=5.0",
  "pydantic>=2.6",
  "anthropic>=0.40",
  "pyyaml>=6.0",
]
st = ["sentence-transformers>=2.7"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["sdk", "."]
include = ["rederive*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["sdk", "."]
